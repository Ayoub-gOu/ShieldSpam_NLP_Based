<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; width: 340px; margin: 12px; font-size: 14px; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 8px; font: inherit; }
    textarea { height: 120px; resize: vertical; }
    button { width: 100%; padding: 8px; font: inherit; cursor: pointer; }
    #result { margin-top: 10px; padding: 8px; border-radius: 4px; display: none; }
    .spam { background: #fde8e8; color: #9b1c1c; }
    .ok   { background: #e6f4ea; color: #1e6b34; }
    .warn { background: #fff4d6; color: #7a5200; }
    #note { margin-top: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Spam Filter</h1>
  <input id="subject" placeholder="Subject">
  <textarea id="message" placeholder="Paste the email text here"></textarea>
  <button id="check">Check</button>
  <div id="result"><div id="verdict"></div><div id="note"></div></div>
  <script src="popup.js"></script>
</body>
</html>
